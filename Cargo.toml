[package]
name = "pktauth"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.2"
clap = { version = "4.6.6", features = ["derive"] }
quinn = { git = "https://github.com/efagerho/quinn", branch = "cid-generator-remote-address", version = "0.12.0" }
rand = "0.10.2"
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
